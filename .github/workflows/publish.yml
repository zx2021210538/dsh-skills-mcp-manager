name: publish

# 发版流程：GitHub Releases 是唯一的发布源。
#
#   在 GitHub 上发布一个 Release（tag 形如 v0.6.2）
#     → 校验 tag 与 package.json 版本一致
#     → 跑门禁（未定义名字 / 单测 / 冒烟 / 预览基线，缺夹具的两项自动跳过）
#     → npm pack 生成 tarball，并把它上传到同一个 Release
#     → 用 npm Trusted Publishing（GitHub OIDC）把同一份包发到 npm，带 provenance
#
# 不需要任何 npm secret：npm 侧已为本仓库 + `publish.yml` 配置了 Trusted Publisher，
# workflow 只需 `id-token: write`，npm CLI 会拿 GitHub 的 OIDC 令牌换发布权限。
# 插件自己的「检查更新」读的是本仓库 releases/latest（src/update.js），
# 所以「发一个 Release」= 用户能检查到新版本 + 能下载 tgz + npm 上也有新版。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包，不上传/不发布
        type: boolean
        default: false

permissions:
  # 上传 release 资产需要写权限；Trusted Publishing 需要 OIDC。
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: 工具链自检（Trusted Publishing 要求 npm ≥ 11.5.1）
        run: |
          set -euo pipefail
          node -v
          npm -v
          npm -v | awk -F. '{ if ($1 > 11 || ($1 == 11 && $2 >= 5)) exit 0; exit 1 }' \
            || { echo "::error::Trusted Publishing 需要 npm ≥ 11.5.1（当前 $(npm -v)）"; exit 1; }

      - name: Release tag 必须等于 package.json 的版本
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$TAG" ]; then
            echo "::error::Release tag ${TAG} 与 package.json 的版本 ${pkg} 不一致：先把 package.json 改成 ${TAG}"
            exit 1
          fi
          echo "版本一致：${pkg}"

      - name: 安装依赖
        run: npm ci

      - name: 构建（dist/ + lib/client.js）
        run: npm run build

      # 与本地一致的门禁。smoke 需要本机 DSH、预览基线需要 /tmp/preview 夹具，
      # CI 上找不到会显式跳过（跳过 ≠ 通过）。
      - name: 门禁
        run: npm run gate

      - name: 打包 tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack
          file="$(ls -1 dsh-skills-mcp-manager-*.tgz | head -n 1)"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          echo "打包完成：${file}"

      - name: 上传 tarball 到 Release
        if: github.event_name == 'release' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$TAG" "$FILE" --clobber

      # 幂等：重跑同一个 workflow 时不因为「该版本已存在」变成红灯。
      - name: 这个版本是否已经在 npm 上
        id: npm_exists
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} 已经在 npm 上，跳过本次发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} 还没发布，准备用 OIDC 发包"
          fi

      - name: 发布 npm 包（Trusted Publishing / OIDC，无 token）
        if: github.event_name == 'release' && inputs.dry_run != true && steps.npm_exists.outputs.exists == 'false'
        run: npm publish --provenance --access public

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### publish: ${{ job.status }}"
            echo "- tag: ${{ github.event.release.tag_name || '（手动触发）' }}"
            echo "- package: $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
            echo "- tarball: ${{ steps.pack.outputs.file }}"
            echo "- npm: ${{ steps.npm_exists.outputs.exists == 'true' && 'already published' || 'published via OIDC' }}"
          } >> "$GITHUB_STEP_SUMMARY"
