# 提交给 DSH 插件市场的条目（仓库已公开：https://github.com/zx2021210538/dsh-skills-mcp-manager）
# 提交位置：awesome-dsh-plugin/awesome-dsh-plugin → data/plugins/zx2021210538__dsh-skills-mcp-manager.yml
#
# 文件名规则 <owner>__<repo>.yml；校验器只认 url / name / category / description / tarball / icon，
# 多写键会被拒；npm 与仓库的对应关系由 CI 从 npm 的 repository 字段自动探测，所以这里没有 npm 字段。
#
# 描述里**点名 fork 来源**（上游 j62268781-alt/dsh-skills-mcp-manager，MIT）并写明两者不能同装 ——
# 这是市场维护者在 PR #9248 里要求的（条目没有单独的 fork/credit 字段，只能写进 description）。
# 同时用一句话概括我们相对 0.5.6 基线新增的能力，避免被当成上游条目的重复。
# 不写 tarball：本项目已发布 npm，版本与安装命令都由市场从 npm 自动取，避免每次发版更新 pinned URL。
url: 'https://github.com/zx2021210538/dsh-skills-mcp-manager'
name: 'zx2021210538/dsh-skills-mcp-manager'
category: ui
description:
  en: 'Forked from j62268781-alt/dsh-skills-mcp-manager (MIT) at its 0.5.6 baseline and substantially reworked since; it registers the same plugin id, so it cannot be installed alongside the original. Adds lossless cordis.patch.yml writes (JS expression values preserved), save-gated per-tool filters, skills governance over the DSH roots plus 10 external agent directories with per-skill/per-source switches enforced through the agent-scope skills provider (disabling actually hides a skill from the model), categories and a restorable trash, GitHub-repository install/update/rollback, zip and SKILL.md import, skills.sh/ClawHub market, workspace view, sidebar panel, dark/light contrast fixes, and update checks against the published npm package (same source as market installs; npm publication carries OIDC provenance).'
  zh: '本插件在 j62268781-alt/dsh-skills-mcp-manager（MIT）的 0.5.6 基线之上分叉并做了大幅重构；两者注册同一个插件 id，不能同时安装。相对基线新增：cordis.patch.yml 的无损写回（保留 JS 表达式值）、保存闸门式逐工具过滤、覆盖 DSH 原生根与 10 个外部 Agent 目录的技能治理与逐技能/逐来源启停（通过 agent-scope skills provider 真正让模型看不到被停用的技能）、分类与可恢复回收站、GitHub 仓库安装/更新/回滚、zip 与 SKILL.md 导入、skills.sh/ClawHub 市场、工作区视图、侧栏面板、亮/暗主题对比度修复，以及读取 npm 发布版本的更新检查（与市场安装源一致；npm 发布带 OIDC provenance）。'
